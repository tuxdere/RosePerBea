<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Il Giardino delle Rose Segrete</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* === RESET & CINEMATIC BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #030005;
            font-family: 'Playfair Display', serif;
            color: #fff5f7;
            touch-action: none;
            position: fixed;
        }

        /* Sfondo profondo stratificato sotto il canvas 3D */
        .cinematic-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 75%, rgba(92, 6, 32, 0.58) 0%, rgba(24, 1, 11, 0.86) 48%, #040007 92%),
                radial-gradient(circle at 50% 20%, rgba(55, 8, 40, 0.35) 0%, transparent 65%);
            z-index: 0;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: default;
        }

        /* Vignettatura cinematografica morbida */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* === UI & TYPOGRAPHY (MOBILE-PERFECT HUD) === */
        #hud-top {
            position: absolute;
            top: max(18px, env(safe-area-inset-top, 18px));
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.8s ease;
            padding: 0 12px;
        }

        #hud-top.visible {
            opacity: 1;
        }

        .counter-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.62rem, 2.5vw, 0.72rem);
            letter-spacing: clamp(1.4px, 0.6vw, 2.6px);
            text-transform: uppercase;
            color: rgba(255, 198, 214, 0.92);
            background: rgba(24, 3, 12, 0.68);
            border: 1px solid rgba(255, 90, 135, 0.3);
            padding: 8px 15px;
            height: 34px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .counter-num {
            font-weight: 500;
            color: #ff85a9;
            margin-left: 5px;
        }

        /* Pulsante Audio compatto e sempre su una riga */
        #audio-toggle {
            pointer-events: auto;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
            gap: 7px;
            background: rgba(24, 3, 12, 0.68);
            border: 1px solid rgba(255, 90, 135, 0.32);
            color: rgba(255, 198, 214, 0.92);
            padding: 8px 14px;
            height: 34px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.62rem, 2.5vw, 0.7rem);
            letter-spacing: clamp(1.3px, 0.5vw, 2px);
            text-transform: uppercase;
            transition: border-color 0.3s ease, background 0.3s ease, transform 0.2s ease;
        }

        #audio-toggle:hover {
            border-color: rgba(255, 110, 150, 0.65);
            background: rgba(38, 5, 19, 0.75);
        }

        #audio-toggle:active {
            transform: scale(0.94);
        }

        .sound-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 11px;
            flex-shrink: 0;
        }

        .sound-bars span {
            width: 2px;
            background: #ff6b96;
            border-radius: 2px;
            height: 3px;
            transition: height 0.3s ease;
        }

        #audio-toggle.playing .sound-bars span:nth-child(1) {
            animation: eqBar 0.95s ease-in-out infinite alternate;
        }
        #audio-toggle.playing .sound-bars span:nth-child(2) {
            animation: eqBar 0.75s ease-in-out 0.2s infinite alternate;
        }
        #audio-toggle.playing .sound-bars span:nth-child(3) {
            animation: eqBar 1.05s ease-in-out 0.4s infinite alternate;
        }

        @keyframes eqBar {
            0% { height: 3px; opacity: 0.6; }
            100% { height: 11px; opacity: 1; }
        }

        /* Titolo iniziale */
        #main-message {
            position: absolute;
            top: 14%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: clamp(1.4rem, 4.5vw, 2.5rem);
            font-weight: 400;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 70, 120, 0.75), 0 4px 15px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s cubic-bezier(0.22, 1, 0.36, 1), transform 2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 4;
            pointer-events: none;
            padding: 0 24px;
            color: #fff2f5;
        }

        #main-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        #main-message.fade-away {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .sub-hint {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.64rem, 2.1vw, 0.78rem);
            letter-spacing: 2.2px;
            text-transform: uppercase;
            color: rgba(255, 165, 192, 0.75);
            margin-top: 10px;
        }

        /* === DEDICA FINALE QUANDO TUTTE LE 7 ROSE SONO STATE SVELATE === */
        #final-message {
            position: absolute;
            top: 13.5%;
            left: 50%;
            transform: translateX(-50%) translateY(18px) scale(0.92);
            width: min(92vw, 600px);
            text-align: center;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.2s cubic-bezier(0.22, 1, 0.36, 1), transform 2.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #final-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .final-title {
            display: block;
            font-size: clamp(1.75rem, 6vw, 2.9rem);
            font-weight: 600;
            font-style: italic;
            letter-spacing: 2px;
            color: #fff7f9;
            text-shadow: 
                0 0 22px rgba(255, 77, 130, 0.9),
                0 0 48px rgba(255, 25, 85, 0.55),
                0 4px 16px rgba(0, 0, 0, 0.9);
            animation: gentleHeartPulse 3.2s ease-in-out infinite alternate;
        }

        .final-sub {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.62rem, 2vw, 0.75rem);
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: rgba(255, 195, 212, 0.82);
            margin-top: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        @keyframes gentleHeartPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 90, 140, 0.3)); }
            100% { transform: scale(1.035); filter: drop-shadow(0 0 24px rgba(255, 120, 165, 0.75)); }
        }

        /* Card del messaggio segreto */
        #popup-message {
            position: fixed;
            bottom: max(5.5%, env(safe-area-inset-bottom, 22px));
            left: 50%;
            transform: translateX(-50%) translateY(35px) scale(0.94);
            background: linear-gradient(145deg, rgba(32, 4, 15, 0.9) 0%, rgba(12, 1, 6, 0.96) 100%);
            border: 1px solid rgba(255, 105, 145, 0.42);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 20px 26px;
            border-radius: 30px;
            font-size: clamp(1.05rem, 3.6vw, 1.4rem);
            font-style: italic;
            color: #fff4f7;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.88), 
                0 0 38px rgba(255, 45, 105, 0.24),
                inset 0 1px 1px rgba(255, 255, 255, 0.14);
            opacity: 0;
            pointer-events: none;
            transition: 
                opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 6;
            text-align: center;
            width: min(92vw, 520px);
            line-height: 1.46;
            text-wrap: balance;
        }

        #popup-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .popup-quote {
            display: block;
            text-shadow: 0 2px 14px rgba(255, 65, 115, 0.38);
        }

        .popup-sub {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 2.2px;
            color: #ff6b96;
            margin-top: 10px;
            font-style: normal;
            font-weight: 400;
        }

        /* === PARTICELLE DOM AL TOCCO === */
        .sparkle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            animation: cinematicSparkle 1.15s cubic-bezier(0.12, 0.8, 0.28, 1) forwards;
        }

        @keyframes cinematicSparkle {
            0% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
                background: #ffffff;
                box-shadow: 0 0 12px 3px #fff, 0 0 22px 5px var(--c);
            }
            45% { opacity: 0.9; }
            100% {
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0);
                opacity: 0;
                background: var(--c);
                box-shadow: 0 0 15px 1px var(--c);
            }
        }
    </style>
</head>
<body>

    <div class="cinematic-bg"></div>
    <div id="webgl-container"></div>
    <div class="vignette"></div>

    <div id="hud-top">
        <div class="counter-pill">
            <span>Rose svelate:</span>
            <span class="counter-num"><span id="discovered-count">0</span> / 7</span>
        </div>
        <button id="audio-toggle" aria-label="Attiva o disattiva audio">
            <div class="sound-bars">
                <span></span><span></span><span></span>
            </div>
            <span id="audio-label">Suono</span>
        </button>
    </div>

    <div id="main-message">
        raccogli la rosa che vuoi
        <span class="sub-hint">Tocca un bocciolo per svelarne il segreto</span>
    </div>

    <div id="final-message">
        <span class="final-title">Ti amo vita mij 🤍🫍</span>
        <span class="final-sub">Tutte le rose del giardino sono tue</span>
    </div>

    <div id="popup-message"></div>

    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (() => {
            // ============================================================================
            // 1. FRASI SEGRETE (CORRISPONDENZA BIUNIVOCA 1:1 CON LE 7 ROSE)
            // ============================================================================
            const phrases = [
                "hai la pelle liscia, fatti scivolare via le cose brutte",
                "vedi? anche questa è fatta",
                "sei un alpaca che spacca",
                "brick by brick",
                "non c'è due senza té",
                "se hai bisogno di me ci sono",
                "sei forte e lo sai, quello che ancora non sai è che lo sei più di quanto tu creda"
            ];

            const discoveredRoses = new Set();
            let celebrationPlayed = false;
            let finalRainActive = false;

            const mainMessage = document.getElementById('main-message');
            const finalMessage = document.getElementById('final-message');
            const popupMessage = document.getElementById('popup-message');
            const hudTop = document.getElementById('hud-top');
            const discoveredCountEl = document.getElementById('discovered-count');
            const audioToggleBtn = document.getElementById('audio-toggle');
            const audioLabelEl = document.getElementById('audio-label');
            let popupTimeout = null;

            // ============================================================================
            // 2. MOTORE SONORO DOLCE E ACCOGLIENTE (CARILLON, ARPA MORBIDA & ACCORDI CALDI)
            // ============================================================================
            class SecretGardenAudio {
                constructor() {
                    this.ctx = null;
                    this.masterGain = null;
                    this.reverbNode = null;
                    this.isMuted = false;
                    this.ambientStarted = false;
                    this.chordTimer = null;
                    this.melodyTimer = null;
                    this.currentChordIndex = 0;

                    this.warmChords = [
                        {
                            pad: [174.61, 220.00, 261.63, 329.63],
                            melodyPool: [349.23, 440.00, 523.25, 659.25, 783.99]
                        },
                        {
                            pad: [130.81, 196.00, 246.94, 293.66],
                            melodyPool: [392.00, 493.88, 523.25, 587.33, 659.25]
                        },
                        {
                            pad: [110.00, 164.81, 196.00, 261.63],
                            melodyPool: [329.63, 392.00, 440.00, 523.25, 659.25]
                        },
                        {
                            pad: [116.54, 174.61, 220.00, 261.63],
                            melodyPool: [349.23, 440.00, 523.25, 587.33, 698.46]
                        }
                    ];

                    this.roseFrequencies = [
                        349.23, // Rosa 1: Fa4
                        392.00, // Rosa 2: Sol4
                        440.00, // Rosa 3: La4
                        523.25, // Rosa 4 (Centro): Do5
                        587.33, // Rosa 5: Re5
                        659.25, // Rosa 6: Mi5
                        698.46  // Rosa 7: Fa5
                    ];
                }

                init() {
                    if (this.ctx) {
                        if (this.ctx.state === 'suspended') {
                            this.ctx.resume();
                        }
                        return;
                    }

                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;

                    this.ctx = new AudioCtx();

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);

                    this.reverbNode = this.createWarmReverb(3.8, 2.6);
                    const reverbFilter = this.ctx.createBiquadFilter();
                    reverbFilter.type = 'lowpass';
                    reverbFilter.frequency.value = 1800;

                    const reverbGain = this.ctx.createGain();
                    reverbGain.gain.value = 0.6;

                    this.reverbNode.connect(reverbFilter);
                    reverbFilter.connect(reverbGain);
                    reverbGain.connect(this.masterGain);

                    this.startSweetSoundtrack();
                    this.updateUI(true);
                }

                createWarmReverb(duration, decay) {
                    const sampleRate = this.ctx.sampleRate;
                    const length = sampleRate * duration;
                    const impulse = this.ctx.createBuffer(2, length, sampleRate);

                    for (let ch = 0; ch < 2; ch++) {
                        const channelData = impulse.getChannelData(ch);
                        let lastSample = 0;
                        for (let i = 0; i < length; i++) {
                            const env = Math.pow(1 - i / length, decay);
                            const white = (Math.random() * 2 - 1);
                            lastSample = (lastSample + (0.12 * white)) / 1.12;
                            channelData[i] = lastSample * env * 1.4;
                        }
                    }

                    const convolver = this.ctx.createConvolver();
                    convolver.buffer = impulse;
                    return convolver;
                }

                startSweetSoundtrack() {
                    if (!this.ctx || this.ambientStarted) return;
                    this.ambientStarted = true;

                    this.playWarmPadChord(this.warmChords[0].pad, 6.8);

                    this.chordTimer = setInterval(() => {
                        if (!this.ctx || this.isMuted || document.hidden) return;
                        this.currentChordIndex = (this.currentChordIndex + 1) % this.warmChords.length;
                        const chord = this.warmChords[this.currentChordIndex];
                        this.playWarmPadChord(chord.pad, 6.8);
                    }, 6200);

                    this.melodyTimer = setInterval(() => {
                        if (!this.ctx || this.isMuted || document.hidden) return;
                        const pool = this.warmChords[this.currentChordIndex].melodyPool;
                        const freq1 = pool[Math.floor(Math.random() * pool.length)];
                        const pan1 = (Math.random() - 0.5) * 0.7;

                        this.triggerSoftMusicBoxNote(freq1, this.ctx.currentTime, 0.042, 3.2, pan1);

                        if (Math.random() < 0.45) {
                            const freq2 = pool[Math.floor(Math.random() * pool.length)];
                            if (freq2 !== freq1) {
                                this.triggerSoftMusicBoxNote(freq2, this.ctx.currentTime + 0.55, 0.032, 3.0, -pan1);
                            }
                        }
                    }, 2100);
                }

                playWarmPadChord(frequencies, duration) {
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;

                    const chordFilter = this.ctx.createBiquadFilter();
                    chordFilter.type = 'lowpass';
                    chordFilter.frequency.setValueAtTime(420, now);
                    chordFilter.frequency.linearRampToValueAtTime(580, now + duration * 0.45);
                    chordFilter.frequency.linearRampToValueAtTime(360, now + duration);

                    const chordGain = this.ctx.createGain();
                    chordGain.gain.setValueAtTime(0.0001, now);
                    chordGain.gain.linearRampToValueAtTime(0.085, now + duration * 0.38);
                    chordGain.gain.linearRampToValueAtTime(0.065, now + duration * 0.68);
                    chordGain.gain.exponentialRampToValueAtTime(0.0001, now + duration + 1.2);

                    chordFilter.connect(chordGain);
                    chordGain.connect(this.masterGain);
                    chordGain.connect(this.reverbNode);

                    frequencies.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const voiceGain = this.ctx.createGain();

                        osc.type = i === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq * (1 + (i % 2 === 0 ? 0.0018 : -0.0018)), now);

                        voiceGain.gain.value = i === 0 ? 0.35 : 0.22;

                        osc.connect(voiceGain);
                        voiceGain.connect(chordFilter);

                        osc.start(now);
                        osc.stop(now + duration + 1.3);
                    });
                }

                triggerSoftMusicBoxNote(freq, startTime, peakGain, duration, panValue = 0) {
                    if (!this.ctx) return;

                    const oscFundamental = this.ctx.createOscillator();
                    const oscWarmOvertone = this.ctx.createOscillator();
                    const warmthFilter = this.ctx.createBiquadFilter();
                    const noteGain = this.ctx.createGain();

                    oscFundamental.type = 'sine';
                    oscFundamental.frequency.setValueAtTime(freq, startTime);

                    oscWarmOvertone.type = 'triangle';
                    oscWarmOvertone.frequency.setValueAtTime(freq * 2, startTime);

                    const overtoneGain = this.ctx.createGain();
                    overtoneGain.gain.setValueAtTime(0.07, startTime);
                    overtoneGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.4);

                    warmthFilter.type = 'lowpass';
                    warmthFilter.frequency.setValueAtTime(freq * 3.2, startTime);
                    warmthFilter.frequency.exponentialRampToValueAtTime(freq * 1.1, startTime + duration * 0.75);

                    noteGain.gain.setValueAtTime(0.0001, startTime);
                    noteGain.gain.linearRampToValueAtTime(peakGain, startTime + 0.045);
                    noteGain.gain.exponentialRampToValueAtTime(peakGain * 0.35, startTime + 0.45);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                    let outputNode = noteGain;
                    if (this.ctx.createStereoPanner) {
                        const panner = this.ctx.createStereoPanner();
                        panner.pan.setValueAtTime(Math.max(-0.75, Math.min(0.75, panValue)), startTime);
                        noteGain.connect(panner);
                        outputNode = panner;
                    }

                    oscFundamental.connect(warmthFilter);
                    oscWarmOvertone.connect(overtoneGain);
                    overtoneGain.connect(warmthFilter);
                    warmthFilter.connect(noteGain);

                    outputNode.connect(this.masterGain);
                    outputNode.connect(this.reverbNode);

                    oscFundamental.start(startTime);
                    oscWarmOvertone.start(startTime);
                    oscFundamental.stop(startTime + duration + 0.08);
                    oscWarmOvertone.stop(startTime + duration + 0.08);
                }

                playRoseChime(roseIndex, panX = 0) {
                    this.init();
                    if (!this.ctx || this.isMuted) return;

                    const baseFreq = this.roseFrequencies[roseIndex] || 523.25;
                    const now = this.ctx.currentTime;

                    this.triggerSoftMusicBoxNote(baseFreq, now, 0.14, 3.2, panX);
                    this.triggerSoftMusicBoxNote(baseFreq * 1.25, now + 0.09, 0.075, 2.9, panX * 0.6);
                    this.triggerSoftMusicBoxNote(baseFreq * 1.498, now + 0.18, 0.065, 3.4, -panX * 0.4);
                    this.triggerSoftMusicBoxNote(baseFreq * 2.0, now + 0.28, 0.038, 2.8, 0);
                }

                playGardenCompletionFlourish() {
                    if (!this.ctx || this.isMuted) return;
                    const now = this.ctx.currentTime + 0.15;

                    this.roseFrequencies.forEach((freq, idx) => {
                        const pan = ((idx / 6) * 2 - 1) * 0.55;
                        this.triggerSoftMusicBoxNote(freq, now + idx * 0.14, 0.085, 4.0, pan);
                    });
                }

                toggleMute() {
                    if (!this.ctx) {
                        this.init();
                        return;
                    }

                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }

                    this.isMuted = !this.isMuted;
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.cancelScheduledValues(now);
                    this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);

                    if (this.isMuted) {
                        this.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                        this.updateUI(false);
                    } else {
                        this.masterGain.gain.exponentialRampToValueAtTime(0.85, now + 0.5);
                        this.updateUI(true);
                    }
                }

                updateUI(isPlaying) {
                    if (isPlaying) {
                        audioToggleBtn.classList.add('playing');
                        audioLabelEl.textContent = 'Suono On';
                    } else {
                        audioToggleBtn.classList.remove('playing');
                        audioLabelEl.textContent = 'Muto';
                    }
                }
            }

            const soundEngine = new SecretGardenAudio();

            audioToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                soundEngine.toggleMute();
            });

            window.addEventListener('pointerdown', () => {
                if (!soundEngine.ctx) {
                    soundEngine.init();
                }
            }, { once: true });

            // ============================================================================
            // 3. INIZIALIZZAZIONE SCENA THREE.JS, CAMERA E LUCI CINEMATOGRAFICHE
            // ============================================================================
            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x060008, 0.038);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            
            const renderer = new THREE.WebGLRenderer({

            // ============================================================================
            // 4. TEXTURE PROCEDURALI MICRO-VENATURE
            // ============================================================================
            function createPetalMicroTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#808080';
                ctx.fillRect(0, 0, 256, 256);

                for (let i = 0; i < 160; i++) {
                    const x = Math.random() * 256;
                    ctx.beginPath();
                    ctx.moveTo(x, 256);
                    ctx.bezierCurveTo(
                        x + (Math.random() - 0.5) * 35, 170,
                        x + (Math.random() - 0.5) * 45, 85,
                        x + (Math.random() - 0.5) * 55, 0
                    );
                    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
                    ctx.lineWidth = Math.random() * 1.8 + 0.5;
                    ctx.stroke();
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                return texture;
            }

            const petalBumpMap = createPetalMicroTexture();

            const petalMaterials = [
                new THREE.MeshPhysicalMaterial({
                    color: 0xff1e56,
                    emissive: 0x38000e,

                    side: THREE.DoubleSide
                }),
                new THREE.MeshPhysicalMaterial({

                    emissive: 0x240008,
                    roughness: 0.48,
                    metalness: 0.02,
                    clearcoat: 0.12,
                    clearcoatRoughness: 0.7,
                    bumpMap: petalBumpMap,
                    bumpScale: 0.015,
                    side: THREE.DoubleSide
                }),
                new THREE.MeshPhysicalMaterial({
                    color: 0xa30029,
                    emissive: 0x160004,
                    roughness: 0.55,
                    metalness: 0.03,
                    clearcoat: 0.08,

            const stemMaterial = new THREE.MeshStandardMaterial({

            const leafMaterial = new THREE.MeshStandardMaterial({

            const thornMaterial = new THREE.MeshStandardMaterial({

            // ============================================================================
            // 5. GEOMETRIE PROCEDURALI: PETALI SCOLPITI, FOGLIE E BOCCIOLI
            // ============================================================================
            function createSculptedPetalGeometry() {
                const geo = new THREE.PlaneGeometry(1, 1.25, 16, 20);
                const pos = geo.attributes.position;

                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i) * 2;
                    const v = (pos.getY(i) / 1.25) + 0.5;

                    const widthProfile = Math.sin(Math.pow(v, 0.68) * Math.PI * 0.94) * 0.92 + 0.14 * (1 - v);
                    const x = u * widthProfile * 0.58;

                    const topNotch = Math.pow(v, 3) * Math.cos(u * Math.PI * 1.5) * 0.06;
                    const y = v * 1.18 + topNotch;

                    const cupDepth = (1 - u * u) * Math.sin(v * Math.PI * 0.85) * 0.28;
                    const outerLipCurl = Math.pow(Math.max(0, v - 0.58) / 0.42, 2.1) * 0.26 * (1 - 0.35 * u * u);
                    const edgeWave = Math.pow(Math.abs(u), 2.2) * Math.pow(v, 1.5) * 0.07 * Math.sin(u * 5);

                    const z = cupDepth - outerLipCurl + edgeWave;

                    pos.setXYZ(i, x, y, z);
                }

                geo.computeVertexNormals();
                return geo;
            }

            function createSculptedLeafGeometry() {
                const geo = new THREE.PlaneGeometry(0.45, 0.9, 10, 14);
                const pos = geo.attributes.position;

                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i) / 0.225;
                    const v = (pos.getY(i) / 0.9) + 0.5;

                    const serration = Math.sin(v * 28) * 0.03 * Math.sin(v * Math.PI);
                    const width = (Math.sin(Math.pow(v, 0.75) * Math.PI) + serration) * 0.26;
                    const x = u * width;
                    const y = v * 0.85;

                    const fold = Math.abs(u) * 0.06;
                    const arch = -Math.pow(v, 1.8) * 0.18;
                    const z = fold + arch;

                    pos.setXYZ(i, x, y, z);
                }

                geo.computeVertexNormals();
                return geo;
            }

            const sharedPetalGeo = createSculptedPetalGeometry();
            const sharedLeafGeo = createSculptedLeafGeometry();
            const sharedThornGeo = new THREE.ConeGeometry(0.032, 0.15, 6);
            sharedThornGeo.translate(0, 0.075, 0);
            sharedThornGeo.rotateX(Math.PI * 0.38);

            function buildRoseHead() {
                const headGroup = new THREE.Group();
                const petalsData = [];
                const totalPetals = 28;
                const goldenAngle = 137.508 * (Math.PI / 180);

                for (let i = 0; i < totalPetals; i++) {
                    const t = i / (totalPetals - 1);
                    const matIndex = Math.min(3, Math.floor(t * 4));
                    
                    const petalMesh = new THREE.Mesh(sharedPetalGeo, petalMaterials[matIndex]);
                    const pivot = new THREE.Group();

                    const theta = i * goldenAngle;
                    const radius = 0.025 + Math.pow(t, 1.35) * 0.22;

                    pivot.position.set(
                        Math.cos(theta) * radius,
                        -Math.pow(t, 1.6) * 0.11,
                        Math.sin(theta) * radius
                    );

                    pivot.rotation.y = -theta + Math.PI / 2;

                    const closedTilt = 0.08 + t * 0.22;
                    const openTilt = 0.16 + Math.pow(t, 1.28) * 1.12;

                    const pScale = 0.28 + Math.pow(t, 0.88) * 0.68;
                    petalMesh.scale.set(pScale * (0.92 + Math.random() * 0.14), pScale, pScale);
                    petalMesh.rotation.z = (Math.random() - 0.5) * 0.12;

                    pivot.rotation.x = -closedTilt;
                    pivot.add(petalMesh);
                    headGroup.add(pivot);

                    petalsData.push({
                        pivot,
                        closedTilt,
                        openTilt,
                        layerRatio: t
                    });
                }

                const coreLight = new THREE.PointLight(0xff2a6d, 0, 2.6);
                coreLight.position.set(0, 0.25, 0);
                headGroup.add(coreLight);

                const receptacleGeo = new THREE.SphereGeometry(0.16, 12, 10);
                receptacleGeo.scale(1, 1.35, 1);
                const receptacle = new THREE.Mesh(receptacleGeo, stemMaterial);
                receptacle.position.y = -0.14;
                headGroup.add(receptacle);

                for (let s = 0; s < 5; s++) {
                    const sepalPivot = new THREE.Group();
                    const sAngle = (s / 5) * Math.PI * 2;
                    sepalPivot.rotation.y = sAngle;
                    sepalPivot.position.y = -0.12;

                    const sepal = new THREE.Mesh(sharedLeafGeo, leafMaterial);
                    sepal.scale.set(0.42, 0.55, 0.42);
                    sepal.rotation.x = Math.PI * 0.62;
                    sepalPivot.add(sepal);
                    headGroup.add(sepalPivot);
                }

                return { headGroup, petalsData, coreLight };
            }

            // ============================================================================
            // 6. COSTRUZIONE DEL GIARDINO DELLE 7 ROSE (POSIZIONI, STELI, FOGLIE, SPINE)
            // ============================================================================
            const gardenGroup = new THREE.Group();
            scene.add(gardenGroup);

            const roseConfigs = [
                { id: 0, x: -3.15, y: -0.65, z: -0.75, scale: 0.78, rotZ:  0.14, rotX: 0.22 },
                { id: 1, x: -2.05, y:  0.35, z:  0.15, scale: 0.88, rotZ:  0.08, rotX: 0.20 },
                { id: 2, x: -0.98, y:  1.25, z: -0.35, scale: 0.95, rotZ:  0.04, rotX: 0.18 },
                { id: 3, x:  0.00, y:  1.95, z:  0.45, scale: 1.12, rotZ:  0.00, rotX: 0.22 },
                { id: 4, x:  0.98, y:  1.18, z: -0.30, scale: 0.95, rotZ: -0.04, rotX: 0.18 },
                { id: 5, x:  2.05, y:  0.28, z:  0.15, scale: 0.88, rotZ: -0.08, rotX: 0.20 },
                { id: 6, x:  3.15, y: -0.72, z: -0.75, scale: 0.78, rotZ: -0.14, rotX: 0.22 }
            ];

            const growthOrder = [3, 2, 4, 1, 5, 0, 6];

            const roses = [];
            const hitTargets = [];
            const baseBottomY = -5.6;
            const stemRadialSegments = 10;
            const stemTubularSegments = 64;

            roseConfigs.forEach((cfg, index) => {
                const roseRoot = new THREE.Group();
                gardenGroup.add(roseRoot);

                const waveStep = growthOrder.indexOf(index);
                const startDelayMs = 250 + waveStep * 420;
                const stemDurationMs = 2600;

                const p0 = new THREE.Vector3(cfg.x * 0.72, baseBottomY, cfg.z - 0.3);
                const p1 = new THREE.Vector3(
                    cfg.x * 0.88 + (index % 2 === 0 ? -0.22 : 0.22),
                    baseBottomY + (cfg.y - baseBottomY) * 0.36,
                    cfg.z + 0.15
                );
                const p2 = new THREE.Vector3(
                    cfg.x * 1.04 + (index % 2 === 0 ? 0.16 : -0.16),
                    baseBottomY + (cfg.y - baseBottomY) * 0.72,
                    cfg.z - 0.1
                );
                const p3 = new THREE.Vector3(cfg.x, cfg.y, cfg.z);

                const curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3]);
                const stemGeo = new THREE.TubeGeometry(curve, stemTubularSegments, 0.048 * cfg.scale, stemRadialSegments, false);
                stemGeo.setDrawRange(0, 0);

                const stemMesh = new THREE.Mesh(stemGeo, stemMaterial);
                roseRoot.add(stemMesh);

                const attachments = [];
                const numNodes = 7;

                for (let n = 1; n <= numNodes; n++) {
                    const tCurve = (n / (numNodes + 1.2)) * 0.88 + 0.06;
                    const point = curve.getPointAt(tCurve);
                    const tangent = curve.getTangentAt(tCurve);

                    const nodeGroup = new THREE.Group();
                    nodeGroup.position.copy(point);
                    nodeGroup.scale.setScalar(0.0001);

                    const sideAngle = (n % 2 === 0 ? 1 : -1) * (Math.PI * 0.45) + (n * 0.7);

                    if (n % 3 === 0) {
                        const thorn = new THREE.Mesh(sharedThornGeo, thornMaterial);
                        nodeGroup.rotation.y = sideAngle;
                        nodeGroup.rotation.z = (n % 2 === 0 ? -0.35 : 0.35);
                        nodeGroup.add(thorn);
                        attachments.push({
                            group: nodeGroup,
                            threshold: tCurve,
                            targetScale: 0.85 * cfg.scale,
                            currentScale: 0.0001
                        });
                    } else {
                        const compoundLeaf = new THREE.Group();
                        
                        const mainLeaf = new THREE.Mesh(sharedLeafGeo, leafMaterial);
                        compoundLeaf.add(mainLeaf);

                        const sideLeafL = new THREE.Mesh(sharedLeafGeo, leafMaterial);
                        sideLeafL.scale.setScalar(0.58);
                        sideLeafL.position.set(-0.06, 0.14, 0);
                        sideLeafL.rotation.z = 0.65;
                        compoundLeaf.add(sideLeafL);

                        const sideLeafR = new THREE.Mesh(sharedLeafGeo, leafMaterial);
                        sideLeafR.scale.setScalar(0.58);
                        sideLeafR.position.set(0.06, 0.14, 0);
                        sideLeafR.rotation.z = -0.65;
                        compoundLeaf.add(sideLeafR);

                        compoundLeaf.rotation.x = Math.PI * 0.32;
                        nodeGroup.rotation.y = sideAngle;
                        nodeGroup.rotation.z = (n % 2 === 0 ? -0.4 : 0.4) + tangent.x * 0.3;
                        nodeGroup.add(compoundLeaf);

                        attachments.push({
                            group: nodeGroup,
                            threshold: tCurve,
                            targetScale: (0.72 + (1 - tCurve) * 0.35) * cfg.scale,
                            currentScale: 0.0001
                        });
                    }

                    roseRoot.add(nodeGroup);
                }

                const { headGroup, petalsData, coreLight } = buildRoseHead();
                headGroup.position.copy(p3);
                headGroup.rotation.set(cfg.rotX, (index - 3) * 0.15, cfg.rotZ);
                headGroup.scale.setScalar(0.0001);
                roseRoot.add(headGroup);

                const hitboxGeo = new THREE.SphereGeometry(0.68, 12, 12);
                const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitboxMesh = new THREE.Mesh(hitboxGeo, hitboxMat);
                hitboxMesh.position.set(0, 0.22, 0);
                hitboxMesh.userData = { roseIndex: index };
                headGroup.add(hitboxMesh);
                hitTargets.push(hitboxMesh);

                roses.push({
                    index,
                    cfg,
                    roseRoot,
                    stemGeo,
                    headGroup,
                    petalsData,
                    coreLight,
                    attachments,
                    startDelayMs,
                    stemDurationMs,
                    bloomProgress: 0,
                    clickPulse: 0,
                    hoverFactor: 0,
                    swayPhase: Math.random() * Math.PI * 2,
                    swaySpeed: 1.1 + Math.random() * 0.45
                });
            });

            setTimeout(() => {
                if (discoveredRoses.size === 0) {
                    mainMessage.classList.add('show');
                }
                hudTop.classList.add('visible');
            }, 5200);

            // ============================================================================
            // 7. SISTEMA DI LUCCIOLE E BOKEH 3D SOSPESI NELLO SPAZIO
            // ============================================================================
            function createGlowParticleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.25, 'rgba(255, 135, 175, 0.85)');
                grad.addColorStop(0.6, 'rgba(255, 40, 100, 0.25)');
                grad.addColorStop(1, 'rgba(255, 0, 60, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }

            const particleCount = 95;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSpeeds = [];

            for (let i = 0; i < particleCount; i++) {
                particlePositions[i * 3]     = (Math.random() - 0.5) * 14;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 12;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 6 - 1;
                particleSpeeds.push({
                    vy: 0.22 + Math.random() * 0.4,
                    vx: (Math.random() - 0.5) * 0.18,
                    phase: Math.random() * Math.PI * 2
                });
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.28,
                map: createGlowParticleTexture(),
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const firefliesPoints = new THREE.Points(particleGeo, particleMat);
            scene.add(firefliesPoints);

            // ============================================================================
            // 8. SISTEMA DI PETALI 3D CHE CADONO (AL TOCCO + PIOGGIA FINALE ROMANTICA)
            // ============================================================================
            const fallingPetals = [];

            function spawnFallingPetals3D(originWorldPos, count = 5) {
                for (let i = 0; i < count; i++) {
                    const matChoice = petalMaterials[Math.floor(Math.random() * 2)];
                    const pMesh = new THREE.Mesh(sharedPetalGeo, matChoice);
                    const scale = 0.16 + Math.random() * 0.12;
                    pMesh.scale.setScalar(scale);
                    pMesh.position.copy(originWorldPos);
                    pMesh.position.x += (Math.random() - 0.5) * 0.35;
                    pMesh.position.y += (Math.random() - 0.5) * 0.25;
                    pMesh.position.z += (Math.random() - 0.5) * 0.35;

                    pMesh.rotation.set(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI
                    );

                    scene.add(pMesh);
                    fallingPetals.push({
                        mesh: pMesh,
                        vy: -(0.52 + Math.random() * 0.42),
                        vx: (Math.random() - 0.5) * 0.55,
                        vz: (Math.random() - 0.5) * 0.38,
                        rx: (Math.random() - 0.5) * 2.2,
                        ry: (Math.random() - 0.5) * 2.2,
                        swayOffset: Math.random() * 10,
                        age: 0,
                        maxAge: 5.5
                    });
                }
            }

            // Pioggia continua di petali dall'alto quando appare "Ti amo vita mij 🤍🫍"
            function startRomanticPetalShower() {
                if (finalRainActive) return;
                finalRainActive = true;

                // Primo soffio di petali dall'alto
                for (let i = 0; i < 14; i++) {
                    const pos = new THREE.Vector3(
                        (Math.random() - 0.5) * 8,
                        4.8 + Math.random() * 2.5,
                        (Math.random() - 0.5) * 2.5
                    );
                    spawnFallingPetals3D(pos, 1);
                }

                // Pioggia dolce e costante in background
                setInterval(() => {
                    if (document.hidden || fallingPetals.length > 35) return;
                    const pos = new THREE.Vector3(
                        (Math.random() - 0.5) * 8.5,
                        5.2,
                        (Math.random() - 0.5) * 2.5
                    );
                    spawnFallingPetals3D(pos, 1);
                }, 480);
            }

            const sparkleColors = ['#ff5c8a', '#ff1a53', '#ffebf0', '#ffd1dc', '#ff99b8'];
            function createCinematicSparkles(screenX, screenY) {
                for (let i = 0; i < 22; i++) {
                    const spark = document.createElement('div');
                    spark.classList.add('sparkle');
                    document.body.appendChild(spark);

                    spark.style.left = `${screenX}px`;
                    spark.style.top = `${screenY}px`;

                    const size = Math.random() * 5.5 + 3;
                    spark.style.width = `${size}px`;
                    spark.style.height = `${size}px`;

                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 95 + 40;
                    const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];

                    spark.style.setProperty('--tx', `${Math.cos(angle) * radius}px`);
                    spark.style.setProperty('--ty', `${Math.sin(angle) * radius}px`);
                    spark.style.setProperty('--c', color);

                    setTimeout(() => spark.remove(), 1150);
                }
            }

            // ============================================================================
            // 9. INTERAZIONE (RAYCASTER 3D, AUDIO SPAZIALE, RESPONSIVE CAMERA)
            // ============================================================================
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            const targetCameraParallax = new THREE.Vector2(0, 0);
            let hoveredRoseIndex = -1;

            function updateCameraResponsiveness() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const aspect = width / height;

                camera.aspect = aspect;

                if (aspect < 0.65) {
                    camera.fov = 56;
                    camera.position.set(0, 0.35, 11.4);
                } else if (aspect < 1.0) {
                    camera.fov = 50;
                    camera.position.set(0, 0.4, 9.8);
                } else {
                    camera.fov = 42;
                    camera.position.set(0, 0.45, 8.2);
                }

                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }

            window.addEventListener('resize', updateCameraResponsiveness);
            updateCameraResponsiveness();

            function getRoseScreenPosition(rose) {
                const worldPos = new THREE.Vector3();
                rose.headGroup.getWorldPosition(worldPos);
                worldPos.y += 0.2 * rose.cfg.scale;
                worldPos.project(camera);

                return {
                    x: (worldPos.x * 0.5 + 0.5) * window.innerWidth,
                    y: (-(worldPos.y * 0.5) + 0.5) * window.innerHeight,
                    pan: worldPos.x,
                    worldPos: rose.headGroup.getWorldPosition(new THREE.Vector3())
                };
            }

            function triggerRoseInteraction(roseIndex) {
                const rose = roses[roseIndex];
                if (!rose || rose.bloomProgress < 0.35) return;

                rose.clickPulse = 1.0;

                const posInfo = getRoseScreenPosition(rose);

                soundEngine.playRoseChime(roseIndex, posInfo.pan);

                discoveredRoses.add(roseIndex);
                discoveredCountEl.textContent = discoveredRoses.size;

                createCinematicSparkles(posInfo.x, posInfo.y);
                spawnFallingPetals3D(posInfo.worldPos, 5);

                const secretPhrase = phrases[roseIndex];
                const allCollectedNote = discoveredRoses.size === 7
                    ? `Rosa ${roseIndex + 1} di 7 • Hai svelato l'intero giardino`
                    : `Segreto della Rosa ${roseIndex + 1}`;

                popupMessage.innerHTML = `
                    <span class="popup-quote">“${secretPhrase}”</span>
                    <span class="popup-sub">${allCollectedNote}</span>
                `;
                popupMessage.classList.add('show');
                mainMessage.classList.add('fade-away');

                const readingTimeMs = secretPhrase.length > 45 ? 6500 : 5000;

                // Se è stata appena raccolta la 7ª rosa, mostra il gran finale romantico
                if (discoveredRoses.size === 7 && !celebrationPlayed) {
                    celebrationPlayed = true;
                    setTimeout(() => {
                        finalMessage.classList.add('show');
                        soundEngine.playGardenCompletionFlourish();
                        startRomanticPetalShower();
                        createCinematicSparkles(window.innerWidth * 0.5, window.innerHeight * 0.22);
                    }, 1800);
                }

                clearTimeout(popupTimeout);
                popupTimeout = setTimeout(() => {
                    popupMessage.classList.remove('show');
                }, readingTimeMs);
            }

            window.addEventListener('pointermove', (e) => {
                const nx = (e.clientX / window.innerWidth) * 2 - 1;
                const ny = -(e.clientY / window.innerHeight) * 2 + 1;

                targetCameraParallax.x = nx * 0.42;
                targetCameraParallax.y = ny * 0.25;

                if (e.pointerType === 'mouse') {
                    pointer.set(nx, ny);
                    raycaster.setFromCamera(pointer, camera);
                    const intersects = raycaster.intersectObjects(hitTargets, false);

                    if (intersects.length > 0) {
                        const idx = intersects[0].object.userData.roseIndex;
                        hoveredRoseIndex = idx;
                        container.style.cursor = 'pointer';
                    } else {
                        hoveredRoseIndex = -1;
                        container.style.cursor = 'default';
                    }
                }
            }, { passive: true });

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#audio-toggle')) return;

                const nx = (e.clientX / window.innerWidth) * 2 - 1;
                const ny = -(e.clientY / window.innerHeight) * 2 + 1;

                targetCameraParallax.x = nx * 0.35;
                targetCameraParallax.y = ny * 0.2;

                pointer.set(nx, ny);
                raycaster.setFromCamera(pointer, camera);
                const intersects = raycaster.intersectObjects(hitTargets, false);

                if (intersects.length > 0) {
                    const roseIndex = intersects[0].object.userData.roseIndex;
                    triggerRoseInteraction(roseIndex);
                }
            });

            // ============================================================================
            // 10. LOOP DI ANIMAZIONE CINEMATOGRAFICA A 60FPS
            // ============================================================================
            function easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            function easeOutBack(x) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
            }

            const clock = new THREE.Clock();
            const startTime = performance.now();

            function animate() {
                requestAnimationFrame(animate);

                const dt = Math.min(clock.getDelta(), 0.1);
                const elapsedSec = clock.getElapsedTime();
                const nowMs = performance.now() - startTime;

                gardenGroup.rotation.y += (targetCameraParallax.x * 0.18 - gardenGroup.rotation.y) * 0.05;
                gardenGroup.rotation.x += (-targetCameraParallax.y * 0.1 - gardenGroup.rotation.x) * 0.05;

                roses.forEach((rose) => {
                    const localTime = nowMs - rose.startDelayMs;

                    if (localTime > 0) {
                        const rawStemProg = Math.min(1, localTime / rose.stemDurationMs);
                        const stemProg = easeOutCubic(rawStemProg);

                        const activeRings = Math.floor(stemProg * stemTubularSegments);
                        rose.stemGeo.setDrawRange(0, activeRings * stemRadialSegments * 6);

                        rose.attachments.forEach((att) => {
                            if (stemProg >= att.threshold) {
                                att.currentScale += (att.targetScale - att.currentScale) * 0.12;
                                att.group.scale.setScalar(att.currentScale);
                            }
                        });

                        if (rawStemProg > 0.72) {
                            const bloomRaw = Math.min(1, (localTime - rose.stemDurationMs * 0.72) / 2400);
                            rose.bloomProgress = easeOutBack(bloomRaw);

                            const isHovered = hoveredRoseIndex === rose.index ? 1 : 0;
                            rose.hoverFactor += (isHovered - rose.hoverFactor) * 0.12;

                            if (rose.clickPulse > 0.001) {
                                rose.clickPulse *= 0.90;
                            } else {
                                rose.clickPulse = 0;
                            }

                            const breatheScale = 1 + Math.sin(elapsedSec * rose.swaySpeed + rose.swayPhase) * 0.028;
                            const interactionScale = 1 + rose.hoverFactor * 0.08 + Math.sin(rose.clickPulse * Math.PI) * 0.16;
                            const finalScale = rose.cfg.scale * Math.max(0.001, rose.bloomProgress) * breatheScale * interactionScale;

                            rose.headGroup.scale.setScalar(finalScale);

                            const openFactor = Math.min(1, bloomRaw * 1.15);
                            const breathePetal = Math.sin(elapsedSec * rose.swaySpeed + rose.swayPhase) * 0.035;
                            const pulsePetal = Math.sin(rose.clickPulse * Math.PI) * 0.14;

                            rose.petalsData.forEach((p) => {
                                const targetTilt = THREE.MathUtils.lerp(p.closedTilt, p.openTilt, easeOutCubic(openFactor))
                                    + (breathePetal + pulsePetal) * p.layerRatio;
                                p.pivot.rotation.x = -targetTilt;
                            });

                            const isDiscovered = discoveredRoses.has(rose.index);
                            const targetLightIntensity = (isDiscovered ? 2.2 : 0.4) + rose.hoverFactor * 1.8 + rose.clickPulse * 4.5;
                            rose.coreLight.intensity += (targetLightIntensity - rose.coreLight.intensity) * 0.1;
                        }
                    }

                    const windSwayZ = Math.sin(elapsedSec * rose.swaySpeed + rose.swayPhase) * 0.018;
                    const windSwayX = Math.cos(elapsedSec * (rose.swaySpeed * 0.8) + rose.swayPhase) * 0.012;
                    rose.roseRoot.rotation.z = windSwayZ;
                    rose.roseRoot.rotation.x = windSwayX;
                });

                const posArr = particleGeo.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const sp = particleSpeeds[i];
                    posArr[i * 3 + 1] += sp.vy * dt;
                    posArr[i * 3]     += Math.sin(elapsedSec * 1.2 + sp.phase) * 0.005 + sp.vx * dt;

                    if (posArr[i * 3 + 1] > 6.5) {
                        posArr[i * 3 + 1] = -6.0;
                        posArr[i * 3] = (Math.random() - 0.5) * 14;
                    }
                }
                particleGeo.attributes.position.needsUpdate = true;

                for (let i = fallingPetals.length - 1; i >= 0; i--) {
                    const fp = fallingPetals[i];
                    fp.age += dt;

                    fp.mesh.position.y += fp.vy * dt;
                    fp.mesh.position.x += (fp.vx + Math.sin(elapsedSec * 2.5 + fp.swayOffset) * 0.35) * dt;
                    fp.mesh.position.z += fp.vz * dt;

                    fp.mesh.rotation.x += fp.rx * dt;
                    fp.mesh.rotation.y += fp.ry * dt;

                    if (fp.age > fp.maxAge || fp.mesh.position.y < -6.5) {
                        scene.remove(fp.mesh);
                        fallingPetals.splice(i, 1);
                    }
                }

                renderer.render(scene, camera);
            }

            animate();
        })();
    </script>
</body>
</html>
